[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimdoc"
version = "0.1.0"
description = "Claim document AI: fine-tuned Qwen2-VL extracts receipts and forms to JSON, validated and compared against OCR + LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Hassan" }]
keywords = ["document-ai", "qwen2-vl", "vision-language-model", "lora", "ocr", "insurance", "cord", "funsd"]
dependencies = ["pillow>=10"]

[project.optional-dependencies]
gpu = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.33", "peft>=0.12", "bitsandbytes>=0.43", "datasets>=2.20"]
ocr = ["pytesseract>=0.3.10"]
llm = ["anthropic>=0.40", "openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pytesseract>=0.3.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["B008", "E501", "B905", "E731"]
